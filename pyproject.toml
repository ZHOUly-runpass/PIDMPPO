[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidmppo"
version = "0.1.0"
description = "Reproducible PID-inspired twin-critic PPO experiments for mapless navigation"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
simulation = ["pybullet>=3.2"]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pidmppo = ["assets/maps/*.json", "assets/robots/*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
